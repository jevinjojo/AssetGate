name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  contracts:
    name: Build · Test · Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive        # pulls lib/forge-std if it's a submodule

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies (T-REX, ONCHAINID, OZ)
        run: npm ci

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv

      - name: Gas regression check
        run: forge snapshot --check

      - name: Coverage (informational)
        run: forge coverage --report summary
        continue-on-error: true

      - name: Solhint
        run: npx solhint 'src/**/*.sol'

  security:
    name: Slither
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        working-directory: packages/contracts
        run: npm ci

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Run Slither
        uses: crytic/slither-action@v0.4.0
        with:
          target: packages/contracts
          slither-args: '--filter-paths "node_modules|lib"'
          fail-on: high